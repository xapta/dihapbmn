name: Tambah peraturan manual

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link peraturan (halaman JDIH atau PDF). Boleh beberapa, pisahkan dengan spasi."
        required: false
        default: ""
      catatan:
        description: "Catatan untuk perangkum (opsional), mis. 'fokus ke ketentuan uang persediaan'"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "inbox/**.pdf"
      - "inbox/**.PDF"

permissions:
  contents: write

concurrency:
  group: pantau-peraturan
  cancel-in-progress: false

jobs:
  tambah:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baca dokumen, ekstrak metadata, dan rangkum dengan Gemini
        id: run
        run: node scripts/manual.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MANUAL_URL: ${{ github.event.inputs.url }}
          MANUAL_NOTE: ${{ github.event.inputs.catatan }}

      - name: Simpan hasil ke repositori
        if: always()
        run: |
          git config user.name "pantau-jdih[bot]"
          git config user.email "pantau-jdih@users.noreply.github.com"
          git add -A public/data public/dokumen scripts/state inbox
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Tambah manual: ${{ steps.run.outputs.summary }}"
            git pull --rebase origin main
            git push
          fi

      - name: Deploy ke Firebase Hosting
        if: steps.run.outputs.added != '0' && steps.run.outputs.added != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
